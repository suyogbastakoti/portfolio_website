<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620">
  <defs>
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd7bd"/>
      <stop offset="1" stop-color="#f4b38f"/>
    </linearGradient>
  </defs>

  <!-- Body / hoodie -->
  <path d="M105 570 Q110 430 180 390 Q260 350 340 390 Q420 430 425 570Z"
        fill="url(#hoodie)" stroke="#111827" stroke-width="12"/>

  <!-- Hood -->
  <path d="M145 430 Q155 335 260 325 Q365 335 375 430 Q330 395 260 405 Q190 395 145 430Z"
        fill="#171326" stroke="#111827" stroke-width="10"/>

  <!-- Head -->
  <path d="M145 185 Q150 80 260 70 Q370 80 375 185 L360 300 Q330 365 260 375 Q190 365 160 300Z"
        fill="url(#skin)" stroke="#111827" stroke-width="10"/>

  <!-- Hair -->
  <path d="M145 185 Q105 135 145 92 Q160 45 220 55 Q255 10 295 55 Q355 35 385 95 Q415 145 375 190
           Q350 145 320 155 Q295 105 265 145 Q235 100 205 150 Q170 125 145 185Z"
        fill="#17121f" stroke="#111827" stroke-width="10"/>

  <!-- Left eye -->
  <g id="left-eye">
    <ellipse cx="205" cy="225" rx="43" ry="50" fill="white" stroke="#111827" stroke-width="8"/>
    <circle id="left-pupil" cx="205" cy="225" r="19" fill="#111827"/>
    <circle cx="212" cy="217" r="6" fill="white"/>
  </g>

  <!-- Right eye -->
  <g id="right-eye">
    <ellipse cx="315" cy="225" rx="43" ry="50" fill="white" stroke="#111827" stroke-width="8"/>
    <circle id="right-pupil" cx="315" cy="225" r="19" fill="#111827"/>
    <circle cx="322" cy="217" r="6" fill="white"/>
  </g>

  <!-- Nose -->
  <path d="M258 245 Q245 275 260 282 Q275 280 270 265" fill="none"
        stroke="#c47f68" stroke-width="7" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M230 305 Q260 325 290 305" fill="none"
        stroke="#111827" stroke-width="7" stroke-linecap="round"/>

  <!-- Laptop -->
  <g>
    <rect x="145" y="445" width="230" height="120" rx="14"
          fill="#111827" stroke="#a3e635" stroke-width="6"/>
    <path d="M120 570 H400 Q385 590 360 590 H160 Q135 590 120 570Z"
          fill="#374151" stroke="#111827" stroke-width="7"/>
    <text x="260" y="515" text-anchor="middle"
          font-family="monospace" font-size="42" font-weight="700" fill="#a3e635">&lt;/&gt;</text>
  </g>

  <!-- Decorative code cards -->
  <rect x="25" y="180" width="105" height="85" rx="14" fill="#171326" stroke="#7c3aed" stroke-width="5"/>
  <text x="77" y="232" text-anchor="middle" font-family="monospace" font-size="28" fill="#a3e635">&lt;/&gt;</text>

  <rect x="390" y="150" width="105" height="85" rx="14" fill="#171326" stroke="#7c3aed" stroke-width="5"/>
  <text x="442" y="202" text-anchor="middle" font-family="monospace" font-size="25" fill="#22d3ee">JS</text>

  <!-- Small sparkles -->
  <circle cx="70" cy="115" r="7" fill="#a3e635"/>
  <circle cx="455" cy="285" r="7" fill="#a3e635"/>
  <path d="M65 315 l15 -15 M72 300 l-15 -15" stroke="#a3e635" stroke-width="7" stroke-linecap="round"/>
  <path d="M440 330 l15 -15 M447 315 l-15 -15" stroke="#a3e635" stroke-width="7" stroke-linecap="round"/>
</svg>
